name: UnitedLib
version: ${project.version}
main: org.unitedlands.UnitedLib
api-version: 1.21
description: Utility library for functionalities shared by United Lands plugins.
author: G0STG0D
contributors: [ Theriel_ ]
softdepend: [ ItemsAdder, Nexo, MythicMobs ]
permissions:
  united.lib.admin:
    description: "UnitedLib admin"
    default: op
commands:
  unitedlib:
    description: "UnitedLib command"
    usage: "/unitedlib <cmd>"
    aliases: [ ulib ]
    permission: united.lib.admin